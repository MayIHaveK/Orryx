Options:
  Type: "DIRECT AIM"
  Name: "无尽深渊"
  ScriptEngine: "JAVASCRIPT"
  Sort: 0
  Icon: "无尽深渊"
  XMaterial: "IRON_SWORD"
  AimRadiusAction: "js: return 20;"
  AimSizeAction: "js: return 8;"
  Description:
    - '&f技能等级&7: &e{{ &level }} &f级'
    - '&f冷却时间&7: &3{{ scaled math div [ lazy *cooldown 20.0 ] }} &fs'
    - '&f灵力消耗&7: &b{{ scaled lazy *mana }}'
    - ''
    - '&f在指定位置召唤一个持续 &b{{ scaled math div [ lazy *duration 20.0 ] }}s &f的深渊黑洞'
    - '&f吸引 &68格 &f范围内的敌人向中心聚拢'
    - '&f每秒对范围内敌人造成 &c{{ scaled lazy *damage }} &f伤害'
    - '&f中心 &63格 &f内血量低于 &410% &f的敌人将被直接斩杀'
    - ''
    - '*&f下一级需求等级&7: &b{{ calc "5+3*level" }}'
  IsLocked: false
  MinLevel: 1
  MaxLevel: 8
  UpgradePointAction: "js: return 1;"
  UpLevelCheckAction: |-
    var targetLevel = Number(vars.get("to"));
    return orryx.jobAPI.modifyJob(player, null, function(playerJob) {
        return playerJob.getLevel() >= 5 + 3 * (targetLevel - 1);
    });
  CastCheckAction: "js: return player != null && player.isOnline();"
  Variables:
    Silence: "js: return 20;"
    Mana: |-
      return 80 + 40 / 7 * (Number(level) - 1);
    Cooldown: |-
      return (30 - 5 / 7 * (Number(level) - 1)) * 20;
    damage: |-
      return 100 + 50 / 7 * (Number(level) - 1);
    duration: |-
      return (5 + 5 / 7 * (Number(level) - 1)) * 20;
Actions: |-
  function isFriendly(target) {
      if (target.getType().name() !== "PLAYER") return false;
      var scoreboard = player.getScoreboard();
      var team = scoreboard.getEntryTeam(player.getName());
      return team != null && team.hasEntry(target.getName());
  }

  function main() {
      var Particle = Java.type("org.bukkit.Particle");
      var LivingEntity = Java.type("org.bukkit.entity.LivingEntity");
      var center = parameter.getOriginLocation().clone().add(0, 0.35, 0);
      var world = center.getWorld();
      var duration = Number(parameter.getVariable("DURATION", true));
      var damage = Number(parameter.getVariable("DAMAGE", true));
      var elapsed = 0;

      var task = scheduler.repeat(function() {
          elapsed += 2;

          world.spawnParticle(Particle.PORTAL, center, 45, 1.5, 0.8, 1.5, 0.12);
          world.spawnParticle(Particle.DRAGON_BREATH, center, 18, 0.65, 0.45, 0.65, 0.02);
          for (var angle = 0; angle < Math.PI * 2; angle += Math.PI / 12) {
              var wave = Math.sin(angle * 3 + elapsed * 0.14) * 0.22;
              var ring = center.clone().add(Math.cos(angle) * 2.8, wave, Math.sin(angle) * 2.8);
              world.spawnParticle(Particle.SOUL_FIRE_FLAME, ring, 1, 0, 0, 0, 0);
          }

          var targets = world.getNearbyEntities(center, 8, 8, 8).toArray();
          for (var i = 0; i < targets.length; i++) {
              var target = targets[i];
              if (!LivingEntity.class.isInstance(target)) continue;
              if (target.getUniqueId().equals(player.getUniqueId())) continue;
              if (target.getType().name() === "ARMOR_STAND" || isFriendly(target)) continue;

              var pull = center.toVector().subtract(target.getLocation().toVector());
              if (pull.lengthSquared() > 0.04) {
                  target.setVelocity(target.getVelocity().multiply(0.65).add(pull.normalize().multiply(0.22)));
              }

              if (elapsed % 20 === 0) {
                  var maxHealth = target.getMaxHealth();
                  if (target.getLocation().distanceSquared(center) <= 9 && target.getHealth() <= maxHealth * 0.1) {
                      target.damage(99999, player);
                  } else {
                      target.damage(damage, player);
                  }
              }
          }

          if (elapsed >= duration) task.complete(true);
      }, 0, 2);
      return task;
  }
