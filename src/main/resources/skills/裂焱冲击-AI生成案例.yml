Options:
  Type: "DIRECT"
  Name: "裂焱冲击"
  ScriptEngine: "JAVASCRIPT"
  Sort: 0
  Icon: "裂焱冲击"
  XMaterial: "BLAZE_ROD"
  Description:
    - '&f技能等级&7: &e{{ &level }} &f级'
    - '&f冷却时间&7: &3{{ scaled math div [ lazy *COOLDOWN 20.0 ] }} &fs'
    - '&f灵力消耗&7: &b{{ scaled lazy *MANA }}'
    - ''
    - '&f向前方冲刺，沿途留下烈焱'
    - '&f对路径上半径 &62.5格 &f内的敌人'
    - '&f每段造成 &c{{ scaled lazy *DAMAGE }} &f点火焰伤害'
    - '&f最多 &65段 &f命中'
    - ''
    - '*&f下一级需求等级&7: &b{{ calc "2+2*level" }}'
  IsLocked: false
  MinLevel: 1
  MaxLevel: 6
  UpgradePointAction: "js: return 1;"
  UpLevelCheckAction: |-
    var targetLevel = Number(vars.get("to"));
    return orryx.jobAPI.modifyJob(player, null, function(playerJob) {
        return playerJob.getLevel() >= 2 + 2 * (targetLevel - 1);
    });
  CastCheckAction: "js: return player != null && player.isOnline();"
  Variables:
    Silence: "js: return 10;"
    Mana: |-
      return 20 - 1 * (Number(level) - 1);
    Cooldown: |-
      return (10 - 0.5 * (Number(level) - 1)) * 20;
    DAMAGE: |-
      return 20 + 3 * (Number(level) - 1);
    SPEED: |-
      return 1.5 + 0.1 * (Number(level) - 1);
Actions: |-
  function isFriendly(target) {
      if (target.getType().name() !== "PLAYER") return false;
      var scoreboard = player.getScoreboard();
      var team = scoreboard.getEntryTeam(player.getName());
      return team != null && team.hasEntry(target.getName());
  }

  function main() {
      var Particle = Java.type("org.bukkit.Particle");
      var PotionEffect = Java.type("org.bukkit.potion.PotionEffect");
      var PotionEffectType = Java.type("org.bukkit.potion.PotionEffectType");
      var LivingEntity = Java.type("org.bukkit.entity.LivingEntity");
      var damage = Number(parameter.getVariable("DAMAGE", true));
      var speed = Number(parameter.getVariable("SPEED", true));
      var direction = player.getLocation().getDirection().normalize();

      player.setVelocity(direction.multiply(speed).setY(-0.1));
      var slowness = PotionEffectType.getByName("SLOWNESS");
      if (slowness == null) slowness = PotionEffectType.getByName("SLOW");
      if (slowness != null) player.addPotionEffect(new PotionEffect(slowness, 12, 4, false, false, false));

      var segment = 0;
      var task = scheduler.repeat(function() {
          segment++;
          var center = player.getLocation().clone().add(0, 0.8, 0);
          var world = center.getWorld();
          world.spawnParticle(Particle.FLAME, center, 24, 0.8, 0.45, 0.8, 0.03);
          world.spawnParticle(Particle.LAVA, center, 5, 0.65, 0.25, 0.65, 0.0);

          var targets = world.getNearbyEntities(center, 2.5, 2.5, 2.5).toArray();
          for (var i = 0; i < targets.length; i++) {
              var target = targets[i];
              if (!LivingEntity.class.isInstance(target)) continue;
              if (target.getUniqueId().equals(player.getUniqueId())) continue;
              if (target.getType().name() === "ARMOR_STAND" || isFriendly(target)) continue;
              target.setFireTicks(Math.max(target.getFireTicks(), 40));
              target.damage(damage, player);
          }

          if (segment >= 5) task.complete(true);
      }, 2, 2);
      return task;
  }
