Options:
  Type: "DIRECT"
  Name: "MayDMZAnimation JavaScript 示例"
  ScriptEngine: "JAVASCRIPT"
  Sort: 998
  Icon: "MayDMZAnimation JS"
  XMaterial: "BLAZE_ROD"
  Description:
    - '&f用 JavaScript 异步调用 Orryx Kether 桥'
    - '&f启用等待点击的 &bmaydmz:rapid_tap_demo'
    - '&f仅在本示例改动分配时，&b200 tick &f后安全恢复原设置'
    - '&f原设置为空时清除指派，并恢复 DragonMineZ 原生平 A'
    - '&7需要安装并激活 MayDMZAnimation'
  IsLocked: false
  MinLevel: 1
  MaxLevel: 1
  UpgradePointAction: "js: return 1;"
  CastCheckAction: "js: return player != null && player.isOnline();"
  IgnoreSilence: false
  Variables:
    MANA: "js: return 0;"
    COOLDOWN: "js: return 20;"
    SILENCE: "js: return 0;"
Actions: |-
  var DEMO_COMBO = "maydmz:rapid_tap_demo";

  function resultForSelf(values) {
      if (values == null) return "";
      var value = values.get(player.getUniqueId().toString());
      return value == null ? "" : String(value);
  }

  function comboOperand(comboId) {
      var value = String(comboId);
      return value.length === 0 ? '"<empty>"' : '"' + value + '"';
  }

  function restoreIfStillOwned(previousCombo) {
      var command = 'maydmz combo compare-and-set ' + comboOperand(DEMO_COMBO)
          + ' ' + comboOperand(previousCombo) + ' they @self';
      return kether.run(command).thenApply(function(restored) {
          var outcome = resultForSelf(restored);
          var accepted = previousCombo.length === 0
              ? outcome === "cleared" || outcome === "unchanged"
              : outcome === "assigned" || outcome === "unchanged";
          if (!accepted) {
              player.sendMessage(outcome === "conflict"
                  ? "§e[Orryx] 连点示例结束；其他操作已接管分配，保持其新设置。"
                  : "§c[Orryx] 连点示例结束，但恢复原分配失败: " + outcome);
              return false;
          }
          player.sendMessage(previousCombo.length === 0
              ? "§7[Orryx] 连点示例已结束，已清除指派并恢复 DragonMineZ 原生平 A。"
              : "§7[Orryx] 连点示例已结束，原连招分配已恢复。");
          return true;
      });
  }

  function main() {
      var CompletableFuture = Java.type("java.util.concurrent.CompletableFuture");
      return kether.run("maydmz available").thenCompose(function(available) {
          if (String(available) !== "true") {
              player.sendMessage("§e[Orryx] MayDMZAnimation 当前不可用，已安全跳过动作。");
              return CompletableFuture.completedFuture(false);
          }
          return kether.run("maydmz combo current they @self").thenCompose(function(current) {
              var previousCombo = resultForSelf(current);
              var assignCommand = 'maydmz combo compare-and-set ' + comboOperand(previousCombo)
                  + ' ' + comboOperand(DEMO_COMBO) + ' they @self';
              return kether.run(assignCommand)
                  .thenCompose(function(results) {
                      var outcome = resultForSelf(results);
                      if (outcome !== "assigned" && outcome !== "unchanged") {
                          player.sendMessage("§c[Orryx] 连点动作未启用: " + outcome);
                          return CompletableFuture.completedFuture(false);
                      }
                      player.sendMessage("§a[Orryx] 连点动作已启用；现在第一次点击才会开始动画: " + outcome);
                      if (outcome === "unchanged") {
                          return CompletableFuture.completedFuture(true);
                      }
                      return scheduler.later(function() {
                          return restoreIfStillOwned(previousCombo);
                      }, 200);
                  });
              });
      });
  }
