Options:
  Type: "DIRECT"
  Name: "MayDMZParticle JavaScript 示例"
  ScriptEngine: "JAVASCRIPT"
  Sort: 996
  Icon: "MayDMZParticle JS"
  XMaterial: "FIREWORK_STAR"
  Description:
    - '&f覆盖实体根、socket、原始骨骼、locator 与世界坐标锚点'
    - '&f演示 TRS、播放句柄、精确停止与实体批量清理'
    - '&7需要安装并激活 MayDMZParticle'
  IsLocked: false
  MinLevel: 1
  MaxLevel: 1
  UpgradePointAction: "js: return 1;"
  CastCheckAction: "js: return player != null && player.isOnline();"
  IgnoreSilence: false
  Variables:
    MANA: "js: return 0;"
    COOLDOWN: "js: return 60;"
    SILENCE: "js: return 0;"
Actions: |-
  function handleForSelf(values) {
      if (values == null) return "";
      var value = values.get(player.getUniqueId().toString());
      return value == null ? "" : String(value);
  }

  function requireHandle(values, label) {
      var handle = handleForSelf(values);
      if (handle.length === 0 || handle === "null") {
          throw new Error(label + " 粒子提交失败，请检查效果 ID、客户端握手与锚点名称。");
      }
      return handle;
  }

  function main() {
      var CompletableFuture = Java.type("java.util.concurrent.CompletableFuture");
      return kether.run("maydmzparticle available").thenCompose(function(available) {
          if (String(available) !== "true") {
              player.sendMessage("§e[Orryx] MayDMZParticle 当前不可用，已安全跳过粒子示例。");
              return CompletableFuture.completedFuture(false);
          }
          return kether.run('maydmzparticle play "dmz:example_bone_sparks" duration 120 offset "-0.45,0.8,0" scale "0.65,0.65,0.65" they @self')
              .thenCompose(function(rootValues) {
                  requireHandle(rootValues, "实体根节点");
                  return kether.run('maydmzparticle play "dmz:example_bone_sparks" bone "socket:right_hand" duration 120 offset "0,-0.15,0" rotation "0,0,25" scale "1.2,1.2,1.2" they @self');
              }).thenCompose(function(socketValues) {
                  requireHandle(socketValues, "语义 socket");
                  return kether.run('maydmzparticle play "dmz:example_bone_sparks" bone "bone:right_arm2" duration 120 offset "0.1,0,0" rotation "0,0,-15" scale "0.8,0.8,0.8" they @self');
              }).thenCompose(function(boneValues) {
                  requireHandle(boneValues, "原始骨骼");
                  return kether.run('maydmzparticle play "dmz:example_bone_sparks" bone "locator:right_hand_item/locator3" duration 120 offset "0,0,0.2" rotation "0,45,0" scale "0.9,0.9,0.9" they @self');
              }).thenCompose(function(locatorValues) {
                  var locatorHandle = requireHandle(locatorValues, "精确 locator");
                  return kether.run('maydmzparticle play-at "dmz:example_burst" duration 100 offset "0,1,0" rotation "0,45,0" scale "1.3,1.3,1.3" they @self')
                      .thenCompose(function(worldValues) {
                          var worldHandle = requireHandle(worldValues, "世界坐标");
                          player.sendMessage("§a[Orryx] 五类客户端粒子锚点已提交；将依次验证句柄停止和实体清理。");
                          return scheduler.later(function() {
                              return kether.run('maydmzparticle stop "' + locatorHandle + '"');
                          }, 40).thenCompose(function(locatorStopped) {
                              player.sendMessage("§b[Orryx] locator 句柄停止结果: " + String(locatorStopped));
                              return scheduler.later(function() {
                                  return kether.run('maydmzparticle stop "' + worldHandle + '"');
                              }, 20);
                          }).thenCompose(function(worldStopped) {
                              player.sendMessage("§b[Orryx] 世界句柄停止结果: " + String(worldStopped));
                              return scheduler.later(function() {
                                  return kether.run('maydmzparticle stop-entity they @self');
                              }, 20);
                          }).thenApply(function(entityStopped) {
                              player.sendMessage("§7[Orryx] 实体粒子清理数量: " + String(entityStopped));
                              return true;
                          });
                      });
              });
      });
  }
