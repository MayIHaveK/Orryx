Options:
  Event: "Dragon Cache Load"
  ScriptEngine: "JAVASCRIPT"
  Weight: 1
  Priority: "normal"
Actions: |-
  function main() {
      var Flag = Java.type("org.gitee.orryx.core.profile.Flag");
      return orryx.skillAPI.modifySkill(player, "无畏护盾-AI生成案例", null, function(playerSkill) {
          return playerSkill.getLevel();
      }).thenCompose(function(skillLevel) {
          if (skillLevel == null || Number(skillLevel) < 1) return Java.type("java.util.concurrent.CompletableFuture").completedFuture(false);
          var rate = 0.10 + 0.025 * (Number(skillLevel) - 1);
          var amount = rate * player.getMaxHealth();
          return orryx.profileAPI.modifyProfile(player, function(profile) {
              profile.setFlag("无畏护盾", new Flag(amount, false, 0, 0), false);
              return true;
          });
      });
  }
