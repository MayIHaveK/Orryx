Options:
  Event: "Orryx Player Flag Change Post"
  ScriptEngine: "JAVASCRIPT"
  Weight: 1
  Priority: "normal"
Actions: |-
  function main() {
      if (event.getFlagName() !== "无畏护盾冷却" || event.getNewFlag() != null) return false;
      var Flag = Java.type("org.gitee.orryx.core.profile.Flag");
      return orryx.skillAPI.modifySkill(player, "无畏护盾-AI生成案例", null, function(playerSkill) {
          return playerSkill.getLevel();
      }).thenApply(function(skillLevel) {
          if (skillLevel == null || Number(skillLevel) < 1) return false;
          var rate = 0.10 + 0.025 * (Number(skillLevel) - 1);
          event.getProfile().setFlag("无畏护盾", new Flag(rate * player.getMaxHealth(), false, 0, 0), false);
          return true;
      });
  }
