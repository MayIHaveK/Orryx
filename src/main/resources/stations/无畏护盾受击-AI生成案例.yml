Options:
  Event: "Player Damaged Pre"
  ScriptEngine: "JAVASCRIPT"
  Weight: 1
  Priority: "normal"
Actions: |-
  function main() {
      if (event.isCancelled()) return false;
      var Flag = Java.type("org.gitee.orryx.core.profile.Flag");
      return orryx.profileAPI.modifyProfile(player, function(profile) {
          var shieldFlag = profile.getFlag("无畏护盾");
          if (shieldFlag == null) return false;

          var shield = Number(shieldFlag.getValue());
          var incoming = Number(event.getDamage());
          profile.setFlag("无畏护盾冷却", new Flag(true, false, 5000, 0), false);

          if (shield >= incoming) {
              event.setCancelled(true);
              profile.setFlag("无畏护盾", new Flag(shield - incoming, false, 0, 0), false);
          } else if (shield > 0) {
              event.setDamage(incoming - shield);
              profile.setFlag("无畏护盾", new Flag(0, false, 0, 0), false);
          }
          return true;
      });
  }
